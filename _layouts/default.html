<!DOCTYPE html>

<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="{{ site.description }}">

  <title>
    {{ page.title }} | {{ site.title }}
  </title>


  <!-- 🌷 Website CSS -->

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">


</head>


<body>


<!-- =========================
     🌷 Navigation
========================= -->

<header class="site-header">

  <div class="nav-container">


    <!-- Logo -->

    <a href="{{ '/' | relative_url }}"
       class="site-logo">

      {{ site.title }}

    </a>


    <!-- Navigation -->

    <nav class="site-nav">

      <a href="{{ '/' | relative_url }}">
        🏠 Home
      </a>

      <a href="{{ '/about' | relative_url }}">
        🌷 About
      </a>

      <a href="{{ '/publications' | relative_url }}">
        📚 Publications
      </a>

      <a href="{{ '/cv' | relative_url }}">
        📄 CV
      </a>

    </nav>


  </div>

</header>



<!-- =========================
     🌸 Main Content
========================= -->

<main class="page-content">

  {{ content }}

</main>



<!-- =========================
     🌷 Footer
========================= -->

<footer class="site-footer">

  <p>
    🌷 Made with ☕, curiosity & a little bit of code.
  </p>

  <p>
    © {{ site.time | date: '%Y' }}
    {{ site.author.name }}
  </p>

</footer>


</body>

</html>
